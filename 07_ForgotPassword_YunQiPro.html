<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yùn Qì Pro — Forgot / Reset Password</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f8f7f4;color:#1a1a18;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.card{background:#fff;border:0.5px solid #e0ded6;border-radius:12px;padding:32px;width:100%;max-width:380px;text-align:center}
.icon-wrap{width:52px;height:52px;border-radius:50%;background:#EEEDFE;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:22px;color:#534AB7}
.card h1{font-size:17px;font-weight:500;margin-bottom:6px}
.card p{font-size:13px;color:#5f5e5a;line-height:1.7;margin-bottom:22px}
.form-group{margin-bottom:14px;text-align:left}
.form-group label{display:block;font-size:12px;color:#5f5e5a;margin-bottom:5px}
.form-group input{width:100%;padding:8px 10px;border:0.5px solid #b4b2a9;border-radius:8px;font-size:13px}
.form-group input:focus{outline:none;border-color:#534AB7;box-shadow:0 0 0 3px #EEEDFE}
.strength-bar{display:flex;gap:3px;margin-top:5px}
.strength-seg{height:3px;flex:1;border-radius:2px;background:#e0ded6}
.strength-seg.active{background:#1D9E75}
.btn-primary{width:100%;padding:10px;background:#534AB7;color:#EEEDFE;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:12px}
.btn-primary:hover{background:#3C3489}
.back-link{font-size:12px;color:#5f5e5a}
.back-link a{color:#534AB7;text-decoration:none}
.success-box{background:#E1F5EE;border-radius:8px;padding:14px;margin-bottom:18px}
.success-box p{font-size:12px;color:#085041;line-height:1.6}
.expire-note{font-size:11px;color:#888780;margin-top:8px}
</style>
</head>
<body>
<div class="card" id="step1">
  <div class="icon-wrap">🔒</div>
  <h1>Forgot your password?</h1>
  <p>Enter your email and we'll send you a link to reset your password.</p>
  <div class="success-box" id="sent-box" style="display:none">
    <p><strong>Email sent.</strong> Check your inbox for a reset link.</p>
  </div>
  <div class="form-group"><label>Email address</label><input type="email" placeholder="you@example.com"></div>
  <button class="btn-primary" onclick="document.getElementById('sent-box').style.display='block'">Send reset link</button>
  <div class="back-link">Remember it? <a href="06_Login_YunQiPro.html">Back to log in</a></div>
  <div class="expire-note">The reset link expires in 1 hour.</div>
</div>
</body>
</html>
