<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yùn Qì Pro — Email Verification</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f8f7f4;color:#1a1a18;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:32px}
.card{background:#fff;border:0.5px solid #e0ded6;border-radius:12px;padding:36px 32px;width:100%;max-width:400px;text-align:center}
.icon-wrap{width:56px;height:56px;border-radius:50%;background:#EEEDFE;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:24px;color:#534AB7}
.card h1{font-size:18px;font-weight:500;margin-bottom:8px}
.card p{font-size:13px;color:#5f5e5a;line-height:1.7;margin-bottom:24px}
.email-highlight{font-weight:500;color:#1a1a18}
.otp-row{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.otp-input{width:44px;height:52px;border:0.5px solid #b4b2a9;border-radius:8px;text-align:center;font-size:20px;font-weight:500}
.otp-input:focus{outline:none;border-color:#534AB7;box-shadow:0 0 0 3px #EEEDFE}
.btn-verify{width:100%;padding:10px;background:#534AB7;color:#EEEDFE;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:16px}
.btn-verify:hover{background:#3C3489}
.resend-row{font-size:12px;color:#5f5e5a;margin-bottom:16px}
.resend-row a{color:#534AB7;text-decoration:none;font-weight:500;cursor:pointer}
.timer{font-size:11px;color:#888780;margin-top:4px}
.divider-line{height:0.5px;background:#e0ded6;margin:16px 0}
.wrong-email{font-size:12px;color:#5f5e5a}
.wrong-email a{color:#534AB7;text-decoration:none}
.spam-note{font-size:11px;color:#888780;margin-top:16px;padding:10px;background:#f8f7f4;border-radius:8px;text-align:left}
</style>
</head>
<body>
<div class="card">
  <div class="icon-wrap">✉</div>
  <h1>Check your email</h1>
  <p>We sent a 6-digit verification code to<br><span class="email-highlight">you@example.com</span></p>
  <div class="otp-row">
    <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
    <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
    <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
    <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
    <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
    <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
  </div>
  <button class="btn-verify">Verify email</button>
  <div class="resend-row">Didn't receive it? <a href="#">Resend code</a><div class="timer"></div></div>
  <div class="divider-line"></div>
  <div class="wrong-email">Wrong email address? <a href="02_SignUp_YunQiPro.html">Change email</a></div>
  <div class="spam-note">If you don't see the email, check your spam or junk folder. The code expires in 10 minutes.</div>
</div>
</body>
</html>
